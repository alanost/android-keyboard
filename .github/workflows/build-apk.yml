name: Build APK

on:
  push:
    branches: [session-replay]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      name: ${{ steps.apk.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          lfs: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;28.2.13676358"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Set up signing
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > key.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=replay"
            echo "storeFile=key.jks"
          } > keystore.properties

      - name: Build
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.30-replay.${{ github.run_number }}
        run: gradle assembleUnstableRelease -s --no-daemon

      - name: Collect APK
        id: apk
        run: |
          name="futo-replay-${{ github.run_number }}.apk"
          found=$(find build/outputs/apk/unstable/release -name '*.apk')
          test "$(echo "$found" | wc -l)" = 1
          cp "$found" "$name"
          sha256sum "$name" > "$name.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: futo-replay-*
          retention-days: 30

  e2e:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.apk.outputs.name }}
          path: dist

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Build field test app
        run: tools/replay/e2e/build_testapp.sh dist/fields.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 tools/replay/e2e/e2e.py "dist/${{ needs.apk.outputs.name }}" dist/fields.apk e2e-out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: e2e-out
          retention-days: 14

  release:
    needs: [apk, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.apk.outputs.name }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "replay-${{ github.run_number }}" futo-replay-*.apk futo-replay-*.sha256 \
            --target "${{ github.sha }}" --prerelease \
            --title "Session Replay build ${{ github.run_number }}" \
            --notes "Modified FUTO Keyboard with local session replay. Based on 0.1.30."
